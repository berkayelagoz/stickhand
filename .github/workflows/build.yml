name: Build

on:
  push:
    branches: [main]
  pull_request
  # Manual run from the Actions tab: lets a branch be checked without opening a PR.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # .NET 10 SDK önce açıkça kurulur; global.json sürümü buna uyar.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Build (Windows)
        run: dotnet build windows/TinyHand.sln -c Release
      - name: Test (Windows)
        run: dotnet test windows/TinyHand.sln -c Release --no-build
      # The release publishes self-contained; catch a broken publish (missing runtime
      # pack, bad version plumbing) here instead of on the release tag.
      - name: Publish (Windows, self-contained)
        run: dotnet publish windows/TinyHand/TinyHand.csproj -c Release -r win-x64 --self-contained true -o windows/dist/publish
