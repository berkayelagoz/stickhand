name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # The Windows job is the only release job: it builds the installer, the portable bundle
  # and the Velopack channel feed, then opens the GitHub Release and attaches them.
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # .NET 10 SDK is pinned by global.json; the runner's default SDK is not trusted.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'

      - name: Install the Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -match '^v(.+)$') { $version = $Matches[1] }
          ./windows/scripts/release-windows.ps1 -Version $version -FetchPrevious

      - uses: actions/upload-artifact@v4
        with:
          name: StickHand-windows
          path: |
            windows/dist/release/StickHand-WindowsSetup.exe
            windows/dist/release/StickHand-Windows-portable.zip
            windows/dist/release/*.sha256
            windows/dist/release/releases.win.json
            windows/dist/release/*.nupkg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          # Release notes come from the annotated tag; the fetch makes sure the tag object
          # itself is present (checkout only guarantees the commit).
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = (git for-each-ref "refs/tags/$tag" --format='%(contents)') -join "`n"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Download StickHand-WindowsSetup.exe and run it. Windows 11 x64."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes | Out-File -FilePath $notesPath -Encoding utf8

          $assets = @(
            "windows/dist/release/StickHand-WindowsSetup.exe",
            "windows/dist/release/StickHand-WindowsSetup.exe.sha256",
            "windows/dist/release/StickHand-Windows-portable.zip",
            "windows/dist/release/StickHand-Windows-portable.zip.sha256",
            "windows/dist/release/releases.win.json"
          )
          $assets += Get-ChildItem "windows/dist/release/*.nupkg" | ForEach-Object { $_.FullName }
          gh release create $tag @assets --title $version --notes-file $notesPath
