name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Take the version and release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TINYHAND_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')"
          if [ -z "$NOTES" ]; then
            NOTES="Download the DMG, open it and drag TinyHand to Applications. Runs on Apple silicon and Intel, macOS 13 or later."
          fi
          {
            echo 'RELEASE_NOTES<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-dmg
          path: |
            dist/release/*.dmg
            dist/release/*.sha256
            dist/release/appcast.xml

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/TinyHand-$VERSION.dmg" "dist/release/TinyHand-$VERSION.dmg.sha256" \
            dist/release/TinyHand.dmg \
            dist/release/appcast.xml \
            --title "$VERSION" --notes "$RELEASE_NOTES"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  # Windows package for the same release: the macOS job above creates the release, this
  # job adds the installer, the portable bundle and the Velopack channel feed to it.
  # One release, two platform packages.
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: release
    # A tag push needs the macOS job to have created the release first (one release, two
    # platform packages). A manual run builds the Windows package even when the macOS job
    # cannot run — a fork without the Apple secrets still gets a testable installer.
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # .NET 10 SDK is pinned by global.json; the runner's default SDK is not trusted.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'

      - name: Install the Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -match '^v(.+)$') { $version = $Matches[1] }
          ./windows/scripts/release-windows.ps1 -Version $version -FetchPrevious

      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-windows
          path: |
            windows/dist/release/TinyHand-WindowsSetup.exe
            windows/dist/release/TinyHand-Windows-portable.zip
            windows/dist/release/*.sha256
            windows/dist/release/releases.win.json
            windows/dist/release/*.nupkg

      - name: Add the Windows assets to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "windows/dist/release/TinyHand-WindowsSetup.exe",
            "windows/dist/release/TinyHand-WindowsSetup.exe.sha256",
            "windows/dist/release/TinyHand-Windows-portable.zip",
            "windows/dist/release/TinyHand-Windows-portable.zip.sha256",
            "windows/dist/release/releases.win.json"
          )
          $assets += Get-ChildItem "windows/dist/release/*.nupkg" | ForEach-Object { $_.FullName }
          gh release upload "${{ github.ref_name }}" @assets --clobber
